name: Deploy to Google Play

# Branch-based deploys to Google Play:
#   • push/merge to `main` → PRODUCTION track (100%), built against the prod API
#   • push/merge to `dev`  → INTERNAL testing track, built against the beta API
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   PLAY_KEYSTORE_BASE64       base64 of your upload keystore .jks
#                              (generate: `base64 -i upload-keystore.jks | pbcopy`)
#   PLAY_KEYSTORE_PASSWORD     keystore (store) password
#   PLAY_KEY_PASSWORD          key password
#   PLAY_KEY_ALIAS             key alias (e.g. "upload")
#   PLAY_SERVICE_ACCOUNT_JSON  full JSON of a Google Play service account with
#                              release permission on both tracks
#
# One-time prerequisites (see .github/PLAY_DEPLOY_SETUP.md):
#   • The app exists in Play Console (package com.algovest.algovest) with one
#     AAB uploaded manually; Play App Signing enabled (keystore = upload key).
#   • Production releases also require a complete store listing (content rating,
#     data safety, target audience, privacy policy, screenshots…).

on:
  push:
    branches: [main, dev]
  workflow_dispatch: {}

concurrency:
  # Independent per branch so a prod release and an internal build don't block.
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # main → production / prod API ; anything else (dev) → internal / beta API
      IS_PROD: ${{ github.ref == 'refs/heads/main' }}
      TRACK: ${{ github.ref == 'refs/heads/main' && 'production' || 'internal' }}
      API_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://api.algovest.online' || 'https://api.beta.algovest.online' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Errors and warnings fail the build; style infos (e.g. withOpacity
        # deprecations) are advisory and don't block a release.
        run: flutter analyze --no-fatal-infos

      - name: Decode upload keystore
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: echo "$PLAY_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build App Bundle
        # versionCode = run_number + offset, kept monotonically increasing and
        # high enough not to collide with the manual first upload (Play rejects
        # duplicate version codes). The version *name* still comes from pubspec.
        # API_BASE_URL is set per-branch in the job env above.
        run: |
          echo "Building for track=$TRACK against $API_BASE_URL"
          flutter build appbundle --release \
            --build-number=$(( ${{ github.run_number }} + 100 )) \
            --dart-define=API_BASE_URL=$API_BASE_URL

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-${{ github.ref_name }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.algovest.algovest
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ env.TRACK }}
          status: completed

      - name: Clean up secrets
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
